let daftarPelanggan=[];async function muatDataPelanggan(){try{const r=await fetch('pelanggan.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;daftarPelanggan=await r.json()}catch(e){daftarPelanggan=[]}}
function showSection(id,btn){document.querySelectorAll('.section').forEach(s=>s.style.display='none');document.getElementById(id).style.display='block';document.querySelectorAll('.menu-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
function formatRupiah(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0))}
function formatTanggal(t){if(!t)return'-';let m=String(t).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(!m)return'-';let b=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];return Number(m[2])>=1&&Number(m[2])<=12?Number(m[1])+' '+b[Number(m[2])-1]+' '+m[3]:'-'}

function cekTagihan(){const id=document.getElementById('id').value.trim(),p=daftarPelanggan.find(x=>String(x.id).trim()===id),r=document.getElementById('result');if(!p){r.style.display='block';r.innerHTML='<div class="statusbox unpaid">ID pelanggan tidak ditemukan.</div>';return}let st=statusTagihan(p),h=Array.isArray(p.riwayat_pembayaran)?p.riwayat_pembayaran:[];let hist=h.slice().sort((a,b)=>String(b.tanggal).localeCompare(String(a.tanggal))).map(x=>`<div class="history-item"><b>${formatTanggal(x.tanggal)||x.tanggal}</b> — ${formatRupiah(x.nominal)}<br>${x.metode||'-'}${x.referensi?' · '+x.referensi:''}</div>`).join('');r.innerHTML=`<div class="bill"><div class="row"><span class="label">Nama</span><span class="value">${p.nama||'-'}</span></div><div class="row"><span class="label">ID Pelanggan</span><span class="value">${p.id}</span></div><div class="row"><span class="label">Paket</span><span class="value">${p.paket||'-'}</span></div><div class="row"><span class="label">Jatuh Tempo</span><span class="value">${Number(p.total||0)>0?formatTanggal(p.jatuh_tempo):'-'}</span></div><div class="row"><span class="label">Tagihan</span><span class="value">${Number(p.total||0)>0?formatRupiah(p.total):'-'}</span></div><div class="statusbox ${st==='LUNAS'?'paid':'unpaid'}">Status: ${st}</div>${h.length?`<div class="history"><b>Riwayat Pembayaran</b>${hist}</div>`:''}<button class="primary" onclick="window.print()">Cetak</button></div>`;r.style.display='block'}
function copyText(t,m){navigator.clipboard.writeText(t).then(()=>showToast(m)).catch(()=>showToast('Salin nomor secara manual'))}function showToast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}function confirmPayment(){let n=document.getElementById('nominal').value;if(!n||Number(n)<=0)return showToast('Masukkan nominal pembayaran');let text='Halo Introvision, saya sudah melakukan pembayaran WiFi sebesar '+formatRupiah(n)+'. Saya akan mengirimkan bukti transfer untuk konfirmasi.';window.open('https://wa.me/6281324091441?text='+encodeURIComponent(text),'_blank')}muatDataPelanggan();
